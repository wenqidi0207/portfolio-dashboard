name: Update market data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

concurrency:
  group: market-data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate and publish snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node --check update-market.js
            node update-market.js
            git add data/market.json
            if git diff --cached --quiet; then
              echo "Market snapshot unchanged"
              exit 0
            fi
            git commit -m "chore: update market snapshot"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Remote changed during attempt ${attempt}; retrying"
          done
          exit 1
