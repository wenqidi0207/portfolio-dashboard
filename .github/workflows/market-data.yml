name: Update market data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'portfolio.json'
      - 'update-market.js'
      - '.github/workflows/market-data.yml'
  schedule:
    # Candidate half-hour windows in UTC. A session check below runs the update
    # only during regular New York trading hours, so this remains correct across
    # U.S. daylight saving time (Beijing market open moves between 21:30/22:30).
    # Offset by two minutes to avoid GitHub's busiest :00/:30 scheduler slots.
    - cron: '32 13 * * 1-5'
    - cron: '2,32 14-19 * * 1-5'
    - cron: '2 20 * * 1-5'

concurrency:
  group: market-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check regular U.S. market session
        id: market_session
        if: github.event_name == 'schedule'
        run: |
          node -e "const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()); const value=Object.fromEntries(parts.map(part=>[part.type,part.value])); const minutes=Number(value.hour)*60+Number(value.minute); const open=!['Sat','Sun'].includes(value.weekday)&&minutes>=570&&minutes<960; console.log('New York market time:', value.weekday, value.hour+':'+value.minute, open?'open':'closed'); require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'open='+open+'\\n');"
      - name: Generate and publish snapshot
        if: github.event_name != 'schedule' || steps.market_session.outputs.open == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node --check update-market.js
            if ! node update-market.js; then
              echo "Market data request failed on attempt ${attempt}; retrying"
              sleep 20
              continue
            fi
            if ! node -e "const fs=require('fs'); const portfolio=JSON.parse(fs.readFileSync('portfolio.json','utf8')); const data=JSON.parse(fs.readFileSync('data/market.json','utf8')); const missing=(portfolio.holdings||[]).filter(item=>!(Number(data.quotes?.[item.code]?.price)>0) || !data.quotes?.[item.code]?.fetchedAt); if (!data.updatedAt || missing.length) { console.error('Snapshot missing fresh holding quotes:', missing.map(item=>item.code).join(', ')); process.exit(1); }"; then
              echo "Generated snapshot failed validation on attempt ${attempt}; retrying"
              sleep 20
              continue
            fi
            git add data/market.json
            if git diff --cached --quiet; then
              echo "Market snapshot unchanged"
              exit 0
            fi
            git commit -m "chore: update market snapshot"
            if git push origin HEAD:main; then
              echo "Market snapshot committed; Pages will deploy after this workflow succeeds"
              exit 0
            fi
            echo "Remote changed during attempt ${attempt}; retrying"
          done
          exit 1
