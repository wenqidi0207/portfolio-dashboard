name: Update market data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'portfolio.json'
      - 'update-market.js'
      - '.github/workflows/market-data.yml'
  schedule:
    # GitHub cron uses UTC. These entries are 21:30-04:00 Beijing time (UTC+8), every 30 minutes.
    - cron: '30 13 * * 1-5'
    - cron: '0,30 14-19 * * 1-5'
    - cron: '0 20 * * 1-5'

concurrency:
  group: market-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate and publish snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node --check update-market.js
            if ! node update-market.js; then
              echo "Market data request failed on attempt ${attempt}; retrying"
              sleep 20
              continue
            fi
            if ! node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('data/market.json','utf8')); if (!data.updatedAt || !data.quotes || Object.keys(data.quotes).length === 0) process.exit(1);"; then
              echo "Generated snapshot failed validation on attempt ${attempt}; retrying"
              sleep 20
              continue
            fi
            git add data/market.json
            if git diff --cached --quiet; then
              echo "Market snapshot unchanged"
              exit 0
            fi
            git commit -m "chore: update market snapshot"
            if git push origin HEAD:main; then
              echo "Market snapshot committed; Pages will deploy after this workflow succeeds"
              exit 0
            fi
            echo "Remote changed during attempt ${attempt}; retrying"
          done
          exit 1
